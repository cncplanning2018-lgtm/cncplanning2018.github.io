<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Kunika Safari - Pyramid AR</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        .ar-btn {
            position: fixed; bottom: 50px; left: 50%; transform: translateX(-50%);
            padding: 20px 40px; color: white; border-radius: 50px;
            display: none; z-index: 9999; text-decoration: none; font-weight: bold;
            border: 2px solid #fff; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            font-family: sans-serif; font-size: 18px; background: #b8860b; /* 金色 */
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden; -webkit-overflow-scrolling: touch;">

    <a id="ar-link" class="ar-btn">ピラミッドを現実に出す</a>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_matrix; matrixCodeType: 3x3;">
        <a-marker id="pyramid-marker" type="pattern" url="./pattern-pyramid.patt">
            <a-entity gltf-model="pyramid.glb" scale="0.1 0.1 0.1" position="0 0 0"></a-entity>
        </a-marker>
        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const btn = document.querySelector('#ar-link');
        const marker = document.querySelector('#pyramid-marker');
        
        const isAndroid = /Android/i.test(navigator.userAgent);
        
        // 現在のフォルダの絶対パス（ベースURL）を正しく取得
        const currentUrl = window.location.origin + window.location.pathname.replace(/\/[^\/]*$/, "");

        marker.addEventListener('markerFound', () => {
            if (isAndroid) {
                // 【Android用】 &resizable=false を追加して実寸大に固定
                const intent = `intent://arvr.google.com/scene-viewer/1.0?file=${currentUrl}/pyramid.glb&mode=ar_only&resizable=false#Intent;scheme=https;package=com.google.android.googlequicksearchbox;action=android.intent.action.VIEW;S.browser_fallback_url=https://developers.google.com/ar;end;`;
                btn.href = intent;
            } else {
                // 【iPhone用】 #allowsContentScaling=0 を追加して実寸大に固定
                btn.href = `${currentUrl}/pyramid.usdz#allowsContentScaling=0`;
                btn.setAttribute('rel', 'ar');
            }
            btn.style.display = 'block';
        });

        marker.addEventListener('markerLost', () => {
            btn.style.display = 'none';
        });
    </script>
</body>
</html>
