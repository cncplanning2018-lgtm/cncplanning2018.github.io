<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Kunika Safari - Final Check</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        .ar-btn {
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
            padding: 20px 40px; color: white; border-radius: 50px;
            display: none; z-index: 9999; text-decoration: none; font-weight: bold;
            border: 2px solid #fff; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            font-family: sans-serif; font-size: 18px; text-align: center;
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden;">

    <a id="ar-link" class="ar-btn"></a>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">
        
        <!-- 9体のマーカーとモデルの定義 -->
        <!-- gltf-model の url() 指定を修正しました -->
        
        <a-marker type="pattern" url="pattern-safari-gaore.patt" id="marker-gaore" class="char-marker" data-id="gaore" data-name="ガオーレ" data-color="#b8860b">
            <a-entity gltf-model="gaore.glb" scale="0.5 0.5 0.5" rotation="0 0 0"></a-entity>
        </a-marker>

        <a-marker type="pattern" url="pattern-safari-kirino.patt" id="marker-kirino" class="char-marker" data-id="kirino" data-name="キリノ" data-color="#ffa500">
            <a-entity gltf-model="kirino.glb" scale="0.5 0.5 0.5"></a-entity>
        </a-marker>

        <a-marker type="pattern" url="pattern-safari-penpen.patt" id="marker-penpen" class="char-marker" data-id="penpen" data-name="ぺんぺん" data-color="#00bfff">
            <a-entity gltf-model="penpen.glb" scale="0.5 0.5 0.5"></a-entity>
        </a-marker>

        <a-marker type="pattern" url="pattern-safari-eldo.patt" id="marker-eldo" class="char-marker" data-id="eldo" data-name="エルド" data-color="#5f9ea0">
            <a-entity gltf-model="eldo.glb" scale="0.5 0.5 0.5"></a-entity>
        </a-marker>

        <a-marker type="pattern" url="pattern-safari-nukumal.patt" id="marker-nukumal" class="char-marker" data-id="nukumal" data-name="ヌクマル" data-color="#ffdead">
            <a-entity gltf-model="nukumal.glb" scale="0.5 0.5 0.5"></a-entity>
        </a-marker>

        <a-marker type="pattern" url="pattern-safari-rirul.patt" id="marker-rirul" class="char-marker" data-id="rirul" data-name="リルル" data-color="#dda0dd">
            <a-entity gltf-model="rirul.glb" scale="0.5 0.5 0.5"></a-entity>
        </a-marker>

        <a-marker type="pattern" url="pattern-safari-ronron.patt" id="marker-ronron" class="char-marker" data-id="ronron" data-name="ロンロン" data-color="#f0e68c">
            <a-entity gltf-model="ronron.glb" scale="0.5 0.5 0.5"></a-entity>
        </a-marker>

        <a-marker type="pattern" url="pattern-safari-rouge.patt" id="marker-rouge" class="char-marker" data-id="rouge" data-name="ルージュ" data-color="#ff4500">
            <a-entity gltf-model="rouge.glb" scale="0.5 0.5 0.5"></a-entity>
        </a-marker>

        <a-marker type="pattern" url="pattern-safari-stra.patt" id="marker-stra" class="char-marker" data-id="stra" data-name="ストラ" data-color="#4682b4">
            <a-entity gltf-model="stra.glb" scale="0.5 0.5 0.5"></a-entity>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const isAndroid = /Android/i.test(navigator.userAgent);
        const btn = document.querySelector('#ar-link');
        const markers = document.querySelectorAll('.char-marker');
        // 現在のディレクトリURLを確実に取得
        const currentUrl = window.location.origin + window.location.pathname.replace(/\/[^\/]*$/, "");

        markers.forEach(m => {
            m.addEventListener('markerFound', () => {
                const id = m.getAttribute('data-id');
                const name = m.getAttribute('data-name');
                const color = m.getAttribute('data-color');
                
                if (isAndroid) {
                    // Android Intent: リンク先が正しいか再チェック
                    btn.href = `intent://arvr.google.com/scene-viewer/1.0?file=${currentUrl}/${id}.glb&mode=ar_only#Intent;scheme=https;package=com.google.android.googlequicksearchbox;action=android.intent.action.VIEW;S.browser_fallback_url=https://developers.google.com/ar;end;`;
                } else {
                    // iPhone Quick Look
                    btn.href = `${id}.usdz`;
                    btn.setAttribute('rel', 'ar');
                }

                btn.innerText = `${name}を現実に呼ぶ`;
                btn.style.background = color;
                btn.style.display = 'block';
            });
            m.addEventListener('markerLost', () => {
                btn.style.display = 'none';
            });
        });
    </script>
</body>
</html>
