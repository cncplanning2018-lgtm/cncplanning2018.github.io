<!DOCTYPE html>
<html>
<head>
<!-- Google tag (gtag.js) -->

<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-XBCWKWTRL0');

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Kunika Safari - Moai AR</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        .ar-btn {
            position: fixed; bottom: 50px; left: 50%; transform: translateX(-50%);
            padding: 20px 40px; color: white; border-radius: 50px;
            display: none; z-index: 9999; text-decoration: none; font-weight: bold;
            border: 2px solid #fff; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            font-family: sans-serif; font-size: 18px; background: #b8860b; /* 金色 */
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden; -webkit-overflow-scrolling: touch;">

    <a id="ar-link" class="ar-btn">モアイを現実に出す</a>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_matrix; matrixCodeType: 3x3;">
        <!-- モアイ用マーカーの設定 -->
        <a-marker id="moai-marker" type="pattern" url="./pattern-moai.patt">
            <!-- プレビュー用モアイモデル -->
            <a-entity gltf-model="moai.glb" scale="0.1 0.1 0.1" position="0 0 0"></a-entity>
        </a-marker>
        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const btn = document.querySelector('#ar-link');
        const marker = document.querySelector('#moai-marker');
        
        const isAndroid = /Android/i.test(navigator.userAgent);
        
        // 現在のフォルダの絶対パス（ベースURL）を取得
        const currentUrl = window.location.origin + window.location.pathname.replace(/\/[^\/]*$/, "");

        marker.addEventListener('markerFound', () => {
            if (isAndroid) {
                // 【Android用】 moai.glb を実寸大固定（&resizable=false）で呼び出し
                const intent = `intent://arvr.google.com/scene-viewer/1.0?file=${currentUrl}/moai.glb&mode=ar_only&resizable=false#Intent;scheme=https;package=com.google.android.googlequicksearchbox;action=android.intent.action.VIEW;S.browser_fallback_url=https://developers.google.com/ar;end;`;
                btn.href = intent;
            } else {
                // 【iPhone用】 moai.usdz を実寸大固定（#allowsContentScaling=0）で呼び出し
                btn.href = `${currentUrl}/moai.usdz#allowsContentScaling=0`;
                btn.setAttribute('rel', 'ar');
            }
            btn.style.display = 'block';
        });

        marker.addEventListener('markerLost', () => {
            btn.style.display = 'none';
        });
    </script>
</body>
</html>
