<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  
  <style>
    .shutter-button {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      width: 70px;
      height: 70px;
      background: white;
      border: 5px solid #FFCC00;
      border-radius: 50%;
      z-index: 9999;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    #flash {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: white;
      z-index: 10000;
      display: none;
    }
  </style>
</head>

<body style="margin: 0px; overflow: hidden;">
  <div id="flash"></div>
  <div id="btn-cap" class="shutter-button"></div>

  <a-scene 
    embedded 
    arjs="debugUIEnabled: false; sourceType: webcam;" 
    screenshot
    renderer="preserveDrawingBuffer: true; antialias: true; alpha: true;">
    
    <a-assets>
      <a-asset-item id="sheep-model" src="dogg.glb"></a-asset-item>
    </a-assets>

    <a-marker type="pattern" url="pattern-marker01.patt">
      <a-entity 
        gltf-model="#sheep-model" 
        scale="1 1 1" 
        position="0 0 0"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear">
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const btn = document.getElementById('btn-cap');
    const sceneEl = document.querySelector('a-scene');
    const flash = document.getElementById('flash');

    btn.addEventListener('click', () => {
      // 1. フラッシュ演出
      flash.style.display = 'block';
      setTimeout(() => { flash.style.display = 'none'; }, 100);

      // 2. 撮影処理
      const video = document.querySelector('video');
      const canvasAR = sceneEl.components.screenshot.getCanvas('perspective');
      
      // 合成用のキャンバスを作成（ビデオの実際の解像度に合わせる）
      const combinedCanvas = document.createElement('canvas');
      combinedCanvas.width =video.clientWidth;
      combinedCanvas.height = video.clientHeight * 0.5;
      const ctx = combinedCanvas.getContext('2d');

      // 背景（カメラ映像）をそのままの比率で描画
      ctx.drawImage(video, 0, 0, combinedCanvas.width, combinedCanvas.height);
      
      // ARモデルをビデオのサイズに合わせて重ねる
      ctx.drawImage(canvasAR, 0, 0, combinedCanvas.width, combinedCanvas.height);

      // 3. ダウンロード実行
      const link = document.createElement('a');
      link.download = 'kagami-en-photo.png';
      link.href = combinedCanvas.toDataURL('image/png');
      link.click();
    });
  </script>
</body>
</html>
