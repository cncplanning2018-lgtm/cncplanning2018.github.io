<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  
  <style>
    /* 撮影ボタンのデザイン */
    .shutter-button {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      width: 70px;
      height: 70px;
      background: white;
      border: 5px solid #FFCC00;
      border-radius: 50%;
      z-index: 9999;
      cursor: pointer;
    }
    .shutter-button:active {
      background: #FFCC00;
    }
    /* フラッシュ演出用 */
    #flash {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: white;
      z-index: 10000;
      display: none;
    }
  </style>
</head>

<body style="margin: 0px; overflow: hidden;">
  <div id="flash"></div>
  <div id="btn-cap" class="shutter-button"></div>

  <a-scene embedded arjs="debugUIEnabled: false;" screenshot>
    
    <a-assets>
      <a-asset-item id="sheep-model" src="dogg.glb"></a-asset-item>
    </a-assets>

    <a-marker type="pattern" url="pattern-marker01.patt">
      <a-entity 
        gltf-model="#sheep-model" 
        scale="1 1 1" 
        position="0 0 0"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear">
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
<a-scene 
  embedded 
  arjs="debugUIEnabled: false;" 
  screenshot
  renderer="preserveDrawingBuffer: true;"> <a-assets>
    <a-asset-item id="sheep-model" src="dogg.glb"></a-asset-item>
  </a-assets>
  
  </a-scene>

<script>
  // 3. スクリプト部分：少し強引に「背景」を合成する処理に変えます
  btn.addEventListener('click', () => {
    flash.style.display = 'block';
    setTimeout(() => { flash.style.display = 'none'; }, 100);

    // scene全体をキャプチャする命令
    const sceneEl = document.querySelector('a-scene');
    // perspective（3Dモデル）をキャプチャ
    const canvas = sceneEl.components.screenshot.getCanvas('perspective');
    
    // 背景のカメラ映像と合成するための処理（簡易版）
    const video = document.querySelector('video');
    const combinedCanvas = document.createElement('canvas');
    combinedCanvas.width = canvas.width;
    combinedCanvas.height = canvas.height;
    const ctx = combinedCanvas.getContext('2d');

    // 1. ビデオ（背景）を描画
    ctx.drawImage(video, 0, 0, combinedCanvas.width, combinedCanvas.height);
    // 2. ARモデルを描画
    ctx.drawImage(canvas, 0, 0, combinedCanvas.width, combinedCanvas.height);

    // 3. ダウンロード実行
    const link = document.createElement('a');
    link.download = 'kagami-en-photo.png';
    link.href = combinedCanvas.toDataURL('image/png');
    link.click();
  });
</script>
</body>
</html>
