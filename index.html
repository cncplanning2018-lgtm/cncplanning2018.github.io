<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Kunika Safari - AR Scanner</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        .ar-launch-button {
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
            padding: 18px 32px; color: white; border-radius: 50px;
            display: none; z-index: 9999; text-decoration: none; font-weight: bold;
            border: 2px solid #fff; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: all 0.3s;
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden;">

    <a id="ar-link" rel="ar" href="" class="ar-launch-button"></a>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        
        <a-marker id="marker-gaole" type="pattern" url="pattern-safari-gaore.patt" class="char-marker" data-id="gaole">
            <a-entity gltf-model="url(gaore.glb)" scale="1.5 1.5 1.5" rotation="0 0 0"></a-entity>
        </a-marker>

        <a-marker id="marker-kirino" type="pattern" url="pattern-marker02.patt" class="char-marker" data-id="kirino">
            <a-entity gltf-model="url(kirino.glb)" scale="1.5 1.5 1.5" rotation="0 0 0"></a-entity>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const config = {
            gaole: { name: "ガオーレを現実に呼ぶ", url: "gaore.usdz", bg: "#b8860b" },
            kirino: { name: "キリノを現実に呼ぶ", url: "kirino.usdz", bg: "#ffa500" }
        };

        const btn = document.querySelector('#ar-link');
        const markers = document.querySelectorAll('.char-marker');

        markers.forEach(m => {
            m.addEventListener('markerFound', () => {
                const data = config[m.getAttribute('data-id')];
                btn.href = data.url;
                btn.innerText = data.name;
                btn.style.background = data.bg;
                btn.style.display = 'block';
            });
            m.addEventListener('markerLost', () => { btn.style.display = 'none'; });
        });
    </script>
</body>
</html>
